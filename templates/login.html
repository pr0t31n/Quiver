<!DOCTYPE html>
<html lang="en" data-palette="tuxedo" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Quiver</title>
  <script>
    (function(){
      var PALETTES=['forge','frigid','futuristic','tuxedo','bloom','retro','prism',
                   'jarvis','jarhead','speakeasy','hogwarts','rivendell','coruscant',
                   'meridian','alabaster','noir','oldglory','alchemist','doom','lcars'];
      try {
        var p=localStorage.getItem('gauntlet-palette');
        var m=localStorage.getItem('gauntlet-mode');
        var h=document.documentElement;
        if(p&&PALETTES.indexOf(p)!==-1)h.setAttribute('data-palette',p);
        if(m==='light'||m==='dark')h.setAttribute('data-mode',m);
      }catch(e){}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    html, body { height: 100%; margin: 0; }
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary, #0d0d0d);
      padding: 1.5rem;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-surface, #1a1a1a);
      border: 1px solid var(--border-mid, #333);
      border-radius: 8px;
      padding: 2.5rem 2rem 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }
    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      margin-bottom: 2rem;
    }
    .auth-logo svg { width: 56px; height: 56px; color: var(--accent-gold, #c8921f); }
    .auth-logo-title {
      font-family: var(--font-display, 'Cinzel', serif);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--text-primary, #e8e8e8);
    }
    .auth-logo-sub {
      font-size: .75rem;
      color: var(--text-muted, #888);
      letter-spacing: .08em;
    }
    .auth-alert {
      background: rgba(200,30,30,.15);
      border: 1px solid rgba(200,30,30,.4);
      border-radius: 4px;
      color: #ff7070;
      font-size: .85rem;
      padding: .6rem .9rem;
      margin-bottom: 1.25rem;
    }
    .auth-field { margin-bottom: 1.1rem; }
    .auth-field label {
      display: block;
      font-size: .78rem;
      letter-spacing: .06em;
      color: var(--text-muted, #888);
      margin-bottom: .35rem;
    }
    .auth-field input {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-primary, #0d0d0d);
      border: 1px solid var(--border-mid, #333);
      border-radius: 4px;
      color: var(--text-primary, #e8e8e8);
      font-size: .95rem;
      padding: .55rem .75rem;
      outline: none;
      transition: border-color .15s;
    }
    .auth-field input:focus { border-color: var(--accent-gold, #c8921f); }
    .auth-submit {
      width: 100%;
      margin-top: .5rem;
      padding: .65rem;
      background: var(--accent-gold, #c8921f);
      border: none;
      border-radius: 4px;
      color: #000;
      font-family: var(--font-display, 'Cinzel', serif);
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .08em;
      cursor: pointer;
      transition: opacity .15s;
    }
    .auth-submit:hover { opacity: .85; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="33" y1="45" x2="27" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".65"/>
        <polygon points="27,10 22,21 33,18" fill="currentColor" opacity=".65"/>
        <line x1="44" y1="45" x2="44" y2="10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
        <polygon points="44,6 39,18 49,18" fill="currentColor" opacity=".9"/>
        <line x1="55" y1="45" x2="61" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".65"/>
        <polygon points="61,10 55,21 66,18" fill="currentColor" opacity=".65"/>
        <path d="M29,44 C28,58 28,72 30,83 L58,83 C60,72 60,58 59,44 Z" fill="currentColor" opacity=".12" stroke="currentColor" stroke-width="2"/>
        <ellipse cx="44" cy="44" rx="15" ry="4.5" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="1.8"/>
        <rect x="29" y="59" width="30" height="5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
        <ellipse cx="44" cy="83" rx="14" ry="3.5" fill="currentColor" opacity=".22" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="auth-logo-title">QUIVER</span>
      <span class="auth-logo-sub">PENTEST HARDWARE MANAGER</span>
    </div>

    {% if error %}
    <div class="auth-alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="auth-field">
        <label for="username">USERNAME</label>
        <input type="text" id="username" name="username" autocomplete="username"
               value="{{ username or '' }}" required autofocus>
      </div>
      <div class="auth-field">
        <label for="password">PASSWORD</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="auth-submit">AUTHENTICATE</button>
    </form>
  </div>
</div>
</body>
</html>
